# A complete PetMate stack: Postgres, the app, and the background worker as its
# own process.
#
# The worker runs separately on purpose. Running it in-process means a restart
# or an autoscaler scaling to zero silently stops sending email, releasing
# escrow and expiring listings — with no error anywhere, because nothing failed.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: petmate
    volumes:
      - petmate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmate -d petmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published. Only the app and the worker need to reach it.
    expose:
      - "5432"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PETMATE_DATABASE_URL: postgresql://petmate:${POSTGRES_PASSWORD}@db:5432/petmate?schema=public
      PETMATE_DIRECT_URL: postgresql://petmate:${POSTGRES_PASSWORD}@db:5432/petmate?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?generate with: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-ledger}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-PetMate <no-reply@petmate.app>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # The worker is its own service below.
      WORKER_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Only meaningful with STORAGE_DRIVER=local, and only correct for a
      # single instance. Use S3 for more than one.
      - petmate-uploads:/app/public/uploads

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PETMATE_DATABASE_URL: postgresql://petmate:${POSTGRES_PASSWORD}@db:5432/petmate?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-PetMate <no-reply@petmate.app>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-ledger}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      WORKER_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  petmate-db:
  petmate-uploads:
